name: Admin UI Sweep

on:
  pull_request:
    branches:
      - main

jobs:
  ui-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BASE_URL: https://admin.xolto.app
      ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cached restore)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run admin UI sweep
        run: pnpm test:ui-sweep

      # Contract: test-results/ is NOT used by this suite. Playwright runtime
      # artifacts (traces, .last-run.json) go to playwright-failures/ (outputDir
      # in playwright.config.ts). Reporter outputs go to playwright-junit/ and
      # playwright-report/. test-results/ is therefore NEVER created on a green
      # run — the [ -d test-results ] check below is false, and the gate passes.
      # On a genuine test failure, Playwright still writes trace subdirs to
      # playwright-failures/; this gate doesn't check that dir (the playwright
      # step itself exits non-zero, failing the job). The gate below is a
      # secondary belt-and-suspenders check: if test-results/ somehow appears,
      # something unexpected wrote to it — surface it.
      # Do NOT change outputDir in playwright.config.ts without updating this comment.
      - name: Verify no failure traces (Class-8 ship-verification)
        if: always()
        run: |
          if [ -d test-results ] && [ -n "$(ls -A test-results 2>/dev/null)" ]; then
            echo "::error::Failure traces exist in test-results/ — gate failed even if playwright exit was 0"
            ls -la test-results/
            exit 1
          fi

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-sweep-failures-${{ github.run_id }}
          path: |
            __tests__/ui-sweep/
            playwright-failures/
          retention-days: 14
          if-no-files-found: ignore
