name: Admin UI Sweep

on:
  pull_request:
    branches:
      - main

jobs:
  ui-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BASE_URL: https://admin.xolto.app
      ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cached restore)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run admin UI sweep
        run: pnpm test:ui-sweep

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-sweep-failures-${{ github.run_id }}
          path: |
            __tests__/ui-sweep/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
